<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Video Presentation</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background: #fafafa;
        }
        h1 {
            margin-bottom: 20px;
            text-align: center;
        }
        h2 {
            margin-top: 40px;
            color: #333;
        }
        .video-block {
            margin-bottom: 35px;
            padding: 15px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
            text-align: center;  /* center entire block */
        }
        video {
            width: 640px;      /* increased from 480 → 640 */
            max-width: 100%;   /* still responsive on small screens */
            margin-top: 10px;
            border-radius: 6px;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }
        .caption {
            margin-top: 10px;
            font-size: 16px;
            font-weight: 500;
            color: #444;
        }
    </style>
</head>

<body>
    <h1>Sim2Real VLA Rebuttal Video Demonstration</h1>

    <!-- Reviewer_1 -->
    <h2>Reviewer 1</h2>

    <div class="video-block">
        <video controls>
            <source src="./webpage_video/Reviewer_1/grasp_doll_real.mp4" type="video/mp4">
        </video>
        <div class="caption">grasp_doll_real</div>
    </div>

    <div class="video-block">
        <video controls>
            <source src="./webpage_video/Reviewer_1/grasp_doll_sim.mp4" type="video/mp4">
        </video>
        <div class="caption">grasp_doll_sim</div>
    </div>

    <div class="video-block">
        <video controls>
            <source src="./webpage_video/Reviewer_1/scoop_ice_sim.mp4" type="video/mp4">
        </video>
        <div class="caption">scoop_ice_sim</div>
    </div>


    <!-- Reviewer_4 -->
    <h2>Reviewer 4</h2>

    <div class="video-block">
        <video controls>
            <source src="webpage_video/Reviewer_4/pure_affordance_execution.mp4" type="video/mp4">
        </video>
        <div class="caption">pure_affordance_execution</div>
    </div>

</body>
</html>
